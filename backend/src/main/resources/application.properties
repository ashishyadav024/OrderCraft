spring.application.name=backend

server.error.include-stacktrace=never

# Database Configuration: Embedded H2 database (persists in ./data/ordercraft, MySQL/Oracle compatible mode)
spring.datasource.url=jdbc:h2:file:./data/ordercraft;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Available at http://localhost:8085/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Alternative: MySQL configuration (uncomment if local MySQL is running)
# spring.datasource.url=jdbc:mysql://localhost:3306/ordercraft?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=Ayu@4715

# "update" automatically creates or updates tables to match entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

server.port=${PORT:8085}

app.jwt.secret=OrderCraftSecretKeyForJwtAuthentication2026VeryLong
app.jwt.expiration-ms=86400000

app.admin.username=admin
app.admin.password=Admin@123
